<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Splash screen, same mark as the app icon foreground: orange square with the pink hard shadow (primary button style) and a hand with the index finger
     extended – the touch (owner's request). Small marks at the fingertip show the touch. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <rect x="140" y="140" width="200" height="200" fill="#FF3D9A" />
    <rect x="116" y="116" width="200" height="200" fill="#FF9A3C" />
    <g fill="#0D0A1A">
        <!-- index finger -->
        <rect x="190" y="150" width="30" height="96" rx="15" />
        <!-- curled middle, ring and little finger (knuckles) -->
        <rect x="218" y="200" width="27" height="50" rx="12" />
        <rect x="243" y="206" width="25" height="46" rx="11" />
        <rect x="266" y="214" width="22" height="40" rx="10" />
        <!-- palm -->
        <path d="M 176 236 L 288 236 L 288 262 Q 288 296 252 298 L 206 298 Q 182 296 176 272 Z" />
        <!-- thumb -->
        <rect x="150" y="214" width="26" height="62" rx="13" transform="rotate(-38 163 245)" />
    </g>
    <!-- touch marks at the fingertip -->
    <g stroke="#0D0A1A" stroke-width="7" stroke-linecap="butt">
        <line x1="205" y1="140" x2="205" y2="124" />
        <line x1="181" y1="148" x2="170" y2="137" />
        <line x1="229" y1="148" x2="240" y2="137" />
    </g>
</svg>
